name: Build and push relay image

# Builds beacon-relay for Linux and pushes it to GHCR, where
# Relay/docker-compose.yml pulls it from. Only changes that can affect the
# relay trigger a build on main; version tags always do.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - Package.swift
      - Package.resolved
      - Sources/BeaconTunnel/**
      - Sources/beacon-relay/**
      - Relay/Dockerfile
      - site/**
      - .dockerignore
      - .github/workflows/relay-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/globusgroup/beacon-relay
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Relay/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=beacon-relay
          cache-to: type=gha,mode=max,scope=beacon-relay
